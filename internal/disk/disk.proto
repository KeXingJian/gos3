syntax = "proto3";

package disk;

option go_package = "github.com/kxj/gos3/internal/disk;disk";

message Empty {}

message FileRequest {
  int32 drive = 1;
  string path = 2;
  // 期望的目标盘 UUID（来自 format.json）。
  // 服务端用它比对本槽位盘的 UUID：不一致说明对端的盘映射已过期
  // （盘被替换或顺序变了），返回 FailedPrecondition 而不是写错盘。
  string drive_uuid = 3;
}

message FileResponse {
  bytes data = 1;
}

message WriteRequest {
  int32 drive = 1;
  string path = 2;
  bytes data = 3;
  string drive_uuid = 4;
}

message StatResponse {
  bool exists = 1;
  bool is_dir = 2;
  int64 size = 3;
  int64 mod_unix = 4;
}

message DirEntry {
  string name = 1;
  bool is_dir = 2;
}

message DirResponse {
  repeated DirEntry entries = 1;
}

message WalkResponse {
  repeated string files = 1;
  repeated string dirs = 2;
}

message RenameRequest {
  int32 drive = 1;
  string src = 2;
  string dst = 3;
  string drive_uuid = 4;
}

// DiskService 是磁盘级数据面：每个 RPC 都作用在「某一块盘」上。
// 节点级信息（成员/布局/存活）在 PeerService（internal/peer）。
service DiskService {
  rpc ReadFile(FileRequest) returns (FileResponse);
  rpc WriteFile(WriteRequest) returns (Empty);
  // Rename 是「临时写入 -> 提交」两阶段写的提交动作，必须原子。
  rpc Rename(RenameRequest) returns (Empty);
  rpc DeleteFile(FileRequest) returns (Empty);
  rpc DeleteDir(FileRequest) returns (Empty);
  rpc MakeDir(FileRequest) returns (Empty);
  rpc Stat(FileRequest) returns (StatResponse);
  rpc ListDir(FileRequest) returns (DirResponse);
  rpc Walk(FileRequest) returns (WalkResponse);
  // Health 探测单块盘的可用性（drive 指定下标）。
  rpc Health(FileRequest) returns (Empty);
}
